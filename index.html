<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk — Sistem Tempahan Baju</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e1b4b;
            --card: rgba(255, 255, 255, 0.98);
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --brand-1: #6366f1;
            --brand-2: #8b5cf6;
            --brand-3: #ec4899;
            --ok: #10b981;
            --err: #ef4444;
            --ring: rgba(99, 102, 241, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        html, body { height: 100%; }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% 0%, rgba(99, 102, 241, 0.35), transparent 60%),
                radial-gradient(1000px 700px at 90% 100%, rgba(236, 72, 153, 0.30), transparent 55%),
                radial-gradient(800px 500px at 50% 50%, rgba(139, 92, 246, 0.20), transparent 60%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* subtle grid overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 24px;
            padding: 44px 40px 36px;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.9) inset,
                0 30px 60px -20px rgba(15, 23, 42, 0.45),
                0 10px 30px -10px rgba(15, 23, 42, 0.25);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(20px);
            animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* soft glow behind card */
        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-3));
            opacity: 0.10;
            z-index: -1;
            filter: blur(24px);
        }

        /* ---- Brand badge ---- */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
            box-shadow:
                0 12px 24px -8px rgba(99, 102, 241, 0.55),
                0 4px 10px -2px rgba(139, 92, 246, 0.35);
            margin-bottom: 18px;
            color: #fff;
        }

        .brand-icon svg { width: 34px; height: 34px; }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .brand p {
            margin-top: 6px;
            font-size: 13.5px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ---- Alerts ---- */
        .alert {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 18px;
            animation: pop 0.25s ease;
        }
        .alert.show { display: flex; }
        .alert svg { flex-shrink: 0; margin-top: 1px; }
        .alert-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

        @keyframes pop {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- Field ---- */
        .field { margin-bottom: 22px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 10px;
            letter-spacing: 0.01em;
        }

        .input-wrap { position: relative; }

        .input-wrap .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: color 0.2s;
            display: flex;
        }

        .input-wrap input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            background: #f8fafc;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .input-wrap input::placeholder {
            text-transform: none;
            letter-spacing: normal;
            font-weight: 500;
            color: #94a3b8;
        }

        .input-wrap input:hover { background: #f1f5f9; }

        .input-wrap input:focus {
            outline: none;
            background: #fff;
            border-color: var(--brand-1);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .input-wrap:focus-within .icon { color: var(--brand-1); }

        .hint {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 9px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ---- Button ---- */
        .btn {
            position: relative;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
            background-size: 200% 200%;
            box-shadow:
                0 10px 20px -8px rgba(99, 102, 241, 0.6),
                0 4px 8px -2px rgba(139, 92, 246, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-position 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            background-position: 100% 50%;
            box-shadow:
                0 14px 26px -8px rgba(99, 102, 241, 0.7),
                0 6px 12px -2px rgba(139, 92, 246, 0.45);
        }

        .btn:active:not(:disabled) { transform: translateY(0); }

        .btn:disabled {
            opacity: 0.85;
            cursor: not-allowed;
            transform: none;
        }

        .btn .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Divider / Meta ---- */
        .meta {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .meta svg { opacity: 0.6; }

        /* Responsive */
        @media (max-width: 440px) {
            .card { padding: 34px 24px 28px; border-radius: 20px; }
            .brand h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">
                <!-- T-shirt icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 3l4 3-2.5 4L16 9v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9L6.5 10 4 6l4-3c0 1.5 1.8 2.5 4 2.5S16 4.5 16 3z"/>
                </svg>
            </div>
            <h1>Sistem Tempahan Baju</h1>
            <p>Log masuk dengan nombor matriks anda</p>
        </div>

        <div class="alert alert-error" id="errorMsg" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText"></span>
        </div>

        <div class="alert alert-success" id="successMsg" role="status">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span id="successText"></span>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="matric">Nombor Matriks</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/>
                        </svg>
                    </span>
                    <input
                        type="text"
                        id="matric"
                        name="matric"
                        placeholder="Contoh: A123456"
                        maxlength="20"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    >
                </div>
                <div class="hint">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    Hanya huruf besar dan nombor (tiada sempang)
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span id="btnLabel">Log Masuk</span>
            </button>
        </form>

        <div class="meta">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Akses khas untuk pengguna berdaftar
        </div>
    </main>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

        // ==== Firebase Config ====
        const firebaseConfig = {
            apiKey: "AIzaSyCByV68jqkMNmIlslrG9bxzbBo6qGYVT4c",
            authDomain: "tempahan-baju-3fd4b.firebaseapp.com",
            projectId: "tempahan-baju-3fd4b",
            storageBucket: "tempahan-baju-3fd4b.firebasestorage.app",
            messagingSenderId: "851807692918",
            appId: "1:851807692918:web:22e7f2a1ff3222def3d757",
            measurementId: "G-HYM6W4JNS9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        getAnalytics(app);

        // ==== Refs ====
        const loginForm = document.getElementById('loginForm');
        const matricInput = document.getElementById('matric');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');
        const successText = document.getElementById('successText');
        const loginBtn = document.getElementById('loginBtn');
        const btnLabel = document.getElementById('btnLabel');

        // Auto-format input
        matricInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        });
        matricInput.addEventListener('keydown', (e) => {
            if (['-', ' ', '_'].includes(e.key)) e.preventDefault();
        });

        function showError(msg) {
            successMsg.classList.remove('show');
            errorText.textContent = msg;
            errorMsg.classList.add('show');
            clearTimeout(showError._t);
            showError._t = setTimeout(() => errorMsg.classList.remove('show'), 5000);
        }

        function showSuccess(msg) {
            errorMsg.classList.remove('show');
            successText.textContent = msg;
            successMsg.classList.add('show');
        }

        function setLoading(on) {
            if (on) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span><span>Menyemak...</span>';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span id="btnLabel">Log Masuk</span>';
            }
        }

        // ==== Login handler ====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const matric = matricInput.value.trim();

            if (!matric)          return showError('Sila masukkan nombor matriks anda.');
            if (!/^[A-Z0-9]+$/.test(matric)) return showError('Format tidak sah. Hanya huruf besar dan nombor dibenarkan.');
            if (matric.length < 5) return showError('Nombor matriks terlalu pendek. Sila semak semula.');

            setLoading(true);
            try {
                const q = query(collection(db, 'users'), where('matric', '==', matric));
                const snap = await getDocs(q);

                if (snap.empty) {
                    return showError('Nombor matriks tidak didaftarkan. Sila hubungi admin.');
                }

                const userDoc = snap.docs[0];
                const userData = userDoc.data();

                const session = {
                    uid: userDoc.id,
                    matric: userData.matric,
                    name: userData.name || userData.matric,
                    role: userData.role || 'user',
                    loginTime: new Date().toISOString()
                };
                sessionStorage.setItem('loggedInUser', JSON.stringify(session));

                showSuccess(`Selamat datang, ${session.name}. Mengalih ke halaman tempahan...`);
                setTimeout(() => window.location.href = 'tempahan.html', 800);

            } catch (err) {
                console.error('Login error:', err);
                showError('Ralat sistem: ' + (err.message || 'Sila cuba lagi.'));
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
